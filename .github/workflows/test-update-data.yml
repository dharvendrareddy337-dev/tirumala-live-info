name: Test Python updater

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/test-update-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run updater unit tests
        working-directory: scripts
        run: python -m unittest -v test_update_data.py
