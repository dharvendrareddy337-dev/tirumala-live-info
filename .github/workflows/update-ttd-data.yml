name: Update Tirumala public information

on:
  workflow_dispatch:
  schedule:
    # Public sources are checked every 15 minutes. GitHub may delay scheduled runs.
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: tirumala-live-info-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public TTD information, publish snapshot and send change alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: python scripts/update_data.py --out data/live.json
